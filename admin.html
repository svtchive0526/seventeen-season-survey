
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVTCHIVE | 계절감 조사 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f5fb;color:#302d40;font-family:Pretendard,sans-serif;letter-spacing:-.04em}
main{max-width:1050px;margin:auto;padding:32px 16px 80px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
small{color:#8b7eaf;font-weight:800}
h1{font-size:clamp(24px,5vw,36px);margin:8px 0}
h2{font-size:19px}
p{color:#777386;line-height:1.6}
.card,.stat{background:white;border:1px solid #e8e5f0;border-radius:20px;padding:22px}
.card{margin-top:20px}
#loginPanel{max-width:460px;margin:65px auto}
input,select,button{font:inherit;border-radius:11px;padding:12px;border:1px solid #dedbe9}
input,select{width:100%;background:white}
button{background:#786a9f;color:white;border:0;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#eeeaf7;color:#645782}
.hidden{display:none!important}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.stat{padding:18px}
.stat span{font-size:12px;color:#777386}
.stat strong{display:block;font-size:28px;margin-top:8px}
.tools{display:grid;grid-template-columns:1fr 160px auto;gap:10px}
.song{border-bottom:1px solid #eeeaf3;padding:20px 0}
.song:last-child{border:0}
.songTitle{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.songTitle span{font-size:12px;color:#888395}
.bar{display:grid;grid-template-columns:76px 1fr 105px;gap:10px;align-items:center;margin:10px 0;font-size:13px}
.track{background:#f0edf6;border-radius:20px;height:10px;overflow:hidden}
.fill{height:100%;background:#9485bc;border-radius:20px}
.number{text-align:right;color:#625978}
.error{color:#bd405b;font-size:13px}
@media(max-width:600px){
.card{padding:16px}
.stat{padding:13px 9px}
.stat strong{font-size:23px}
.tools{grid-template-columns:1fr 120px}
.tools button{grid-column:1/-1}
.bar{grid-template-columns:65px 1fr 95px;gap:6px}
}
</style>
</head>
<body>
<main>
<header>
<div>
<small>SVTCHIVE · PRIVATE ADMIN</small>
<h1>계절감 조사 통계 💎</h1>
</div>
<button id="logout" class="secondary hidden">로그아웃</button>
</header>
<p>세븐틴 47곡 · 전체 계절감 조사 결과 · 관리자 전용</p>

<section id="loginPanel" class="card">
<h2>관리자 로그인</h2>
<p>등록된 관리자 이메일로 로그인 링크를 보내요.</p>
<form id="loginForm">
<input id="email" type="email" placeholder="관리자 이메일" required>
<p><button id="loginButton">로그인 링크 받기</button></p>
</form>
<p id="loginMessage"></p>
</section>

<section id="dashboard" class="hidden">
<div class="stats">
<div class="stat"><span>전체 제출 건수</span><strong id="total">—</strong></div>
<div class="stat"><span>조사 대상 곡</span><strong id="songs">47</strong></div>
<div class="stat"><span>계절 선택 합계</span><strong id="selections">—</strong></div>
</div>

<div class="tools">
<input id="search" placeholder="곡 제목 검색">
<select id="section">
<option value="all">전체 47곡</option>
<option value="1">한국곡</option>
<option value="2">일본곡</option>
<option value="3">유닛곡</option>
</select>
<button id="csv">CSV 다운로드</button>
</div>

<div class="card">
<header>
<h2>곡별 계절감 분포</h2>
<button id="refresh" class="secondary">새로고침</button>
</header>
<p>각 계절의 비율은 해당 곡의 전체 응답 건수를 기준으로 계산해요. 복수 선택으로 합계가 100%를 넘을 수 있어요.</p>
<div id="results">결과를 불러오는 중...</div>
<p id="error" class="error"></p>
</div>
</section>
</main>

<script type="module">
import {createClient} from
'https://esm.sh/@supabase/supabase-js@2';

const PROJECT_URL =
'https://gwurlyglebodlewhdbqo.supabase.co';

// 아래 문자열만 공개용 키로 교체하세요.
const PUBLIC_KEY = '여기에_SUPABASE_공개키_입력';

const ENDPOINT =
PROJECT_URL + '/functions/v1/season-admin-results';

const $ = id => document.getElementById(id);
const labels = ['봄','여름','가을','겨울','사계절 내내'];
const keys = [
'spring','summer','autumn','winter','all_seasons'
];

const escapeHTML = value =>
String(value ?? '').replace(/[&<>"']/g, c =>
({'&':'&amp;','<':'&lt;','>':'&gt;',
'"':'&quot;',"'":'&#39;'}[c])
);

let records = [];

const client = createClient(PROJECT_URL, PUBLIC_KEY, {
auth:{
persistSession:true,
detectSessionInUrl:true
}
});

async function showSession(session){
$('loginPanel').classList.toggle('hidden',!!session);
$('dashboard').classList.toggle('hidden',!session);
$('logout').classList.toggle('hidden',!session);
if(session) await load();
}

client.auth.onAuthStateChange((event,session)=>{
setTimeout(()=>showSession(session),0);
});

client.auth.getSession().then(({data})=>{
showSession(data.session);
});

$('loginForm').onsubmit = async event => {
event.preventDefault();
$('loginButton').disabled = true;
$('loginMessage').textContent = '로그인 링크 전송 중...';

const {error} = await client.auth.signInWithOtp({
email:$('email').value.trim(),
options:{
emailRedirectTo:
location.origin + location.pathname
}
});

$('loginButton').disabled = false;
$('loginMessage').textContent = error
? '전송 실패: '+error.message
: '이메일로 로그인 링크를 보냈어요!';
};

$('logout').onclick = async ()=>{
await client.auth.signOut();
};

$('refresh').onclick = load;
$('search').oninput = render;
$('section').onchange = render;

async function load(){
$('error').textContent = '';
$('results').textContent = '실제 결과를 불러오는 중...';

try{
const {data:{session}} = await client.auth.getSession();
if(!session) throw Error('로그인이 필요해요.');

const response = await fetch(ENDPOINT,{
method:'GET',
headers:{
Authorization:'Bearer '+session.access_token,
apikey:PUBLIC_KEY
},
cache:'no-store'
});

const payload = await response.json();

if(!response.ok || !payload.ok){
throw Error(payload.error || '통계 조회 실패');
}

records = payload.results || [];

$('total').textContent =
Number(payload.summary?.submissions || 0)
.toLocaleString('ko-KR');

$('songs').textContent =
Number(payload.summary?.songs || records.length)
.toLocaleString('ko-KR');

$('selections').textContent =
Number(payload.summary?.selections || 0)
.toLocaleString('ko-KR');

render();

}catch(error){
$('results').textContent = '결과를 불러오지 못했어요.';
$('error').textContent = error.message;
}
}

function render(){
const query = $('search').value.trim().toLowerCase();
const section = $('section').value;

const filtered = records.filter(r =>
(section === 'all' || String(r.section_no) === section)
&& String(r.title).toLowerCase().includes(query)
);

$('results').innerHTML = filtered.map(r=>{
const total = Number(r.respondents || 0);

const bars = labels.map((name,i)=>{
const votes = Number(r[keys[i]] || 0);
const pct = total ? votes / total * 100 : 0;

return `
<div class="bar">
<span>${name}</span>
<div class="track">
<div class="fill" style="width:${Math.min(pct,100).toFixed(2)}%"></div>
</div>
<span class="number">
${votes.toLocaleString('ko-KR')}건 · ${pct.toFixed(1)}%
</span>
</div>`;
}).join('');

return `
<article class="song">
<div class="songTitle">
<strong>${escapeHTML(r.title)}</strong>
<span>
응답 ${total.toLocaleString('ko-KR')}건 ·
미선택 ${Number(r.no_selection || 0)}건
</span>
</div>
${bars}
</article>`;
}).join('') || '<p>조건에 맞는 곡이 없어요.</p>';
}

$('csv').onclick = ()=>{
const columns = [
'section_no','sort_order','title','respondents',
...keys,'no_selection'
];

const rows = [
columns.join(','),
...records.map(r=>
columns.map(key=>
'"'+String(r[key]??'').replace(/"/g,'""')+'"'
).join(',')
)
];

const blob = new Blob(
['\ufeff'+rows.join('\r\n')],
{type:'text/csv;charset=utf-8'}
);

const link = document.createElement('a');
const objectURL = window.URL.createObjectURL(blob);
link.href = objectURL;
link.download = 'svtchive-season-results.csv';
link.click();
setTimeout(()=>window.URL.revokeObjectURL(objectURL),1000);
};
</script>
</body>
</html>
